<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年齢一覧</title>
</head>
<body>
  <main>
    <h1>年齢一覧</h1>
    <div id="age-list" aria-live="polite">読み込み中...</div>
  </main>

  <script type="module">
    import { fetchCsv } from '../js/common.js';

    const list = document.querySelector('#age-list');

    try {
      const people = await fetchCsv('../data/age.csv');
      const peopleByYear = new Map();
      for (const person of people) {
        const year = person['生年'];
        const peopleBornInYear = peopleByYear.get(year) ?? [];
        peopleBornInYear.push(person);
        peopleByYear.set(year, peopleBornInYear);
      }
      const fragment = document.createDocumentFragment();

      for (const [year, peopleBornInYear] of peopleByYear) {
        const section = document.createElement('section');
        const heading = document.createElement('h2');
        const names = document.createElement('p');

        heading.textContent = `${year}年`;
        names.textContent = peopleBornInYear
          .map((person) => `${person['名前']}（${person['分類']}）`)
          .join(', ');
        section.append(heading, names);
        fragment.append(section);
      }

      list.replaceChildren(fragment);
    } catch (error) {
      console.error(error);
      list.textContent = '年齢一覧を読み込めませんでした。';
    }
  </script>
</body>
</html>
