<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年齢一覧</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; }
    td:nth-child(-n+3) { white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>年齢一覧</h1>
    <div id="age-list" aria-live="polite">読み込み中...</div>
  </main>

  <script type="module">
    import { fetchCsv } from '../js/common.js';

    const list = document.querySelector('#age-list');

    try {
      const people = await fetchCsv('../data/age.csv');
      const currentYear = new Date().getFullYear();
      const peopleByYear = new Map();

      for (const person of people) {
        const year = Number(person['生年']);
        const peopleBornInYear = peopleByYear.get(year) ?? [];
        peopleBornInYear.push(person);
        peopleByYear.set(year, peopleBornInYear);
      }

      const table = document.createElement('table');
      const header = table.createTHead().insertRow();
      for (const label of ['生年', '年齢', '1993年生まれとの差', '人物', '属性']) {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        header.append(cell);
      }

      const body = table.createTBody();
      const years = [...peopleByYear.keys()].sort((a, b) => b - a);
      for (const year of years) {
        const peopleBornInYear = peopleByYear.get(year);
        const difference = 1993 - year;
        const differenceLabel = difference === 0
          ? '同い年'
          : `${Math.abs(difference)}歳${difference > 0 ? '年上' : '年下'}`;
        const row = body.insertRow();
        const values = [
          `${year}年`,
          `${currentYear - year}歳`,
          differenceLabel,
          peopleBornInYear.map((person) => person['名前']).join(', '),
          [...new Set(peopleBornInYear.map((person) => person['分類']))].join(', '),
        ];

        for (const value of values) {
          const cell = row.insertCell();
          cell.textContent = value;
        }
      }

      list.replaceChildren(table);
    } catch (error) {
      console.error(error);
      list.textContent = '年齢一覧を読み込めませんでした。';
    }
  </script>
</body>
</html>
